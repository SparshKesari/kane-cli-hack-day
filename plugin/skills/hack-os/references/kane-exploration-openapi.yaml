openapi: 3.1.0
info:
  title: KaneAI Exploration API (read-only)
  version: "12.0"
  license:
    name: Proprietary
    url: https://www.lambdatest.com/legal/terms-of-service
  contact:
    name: LambdaTest KaneAI
    url: https://www.lambdatest.com/support
  summary: Read the maps, findings and evidence that KaneAI explorations recorded.
  description: |
    The read-only Kane AI exploration API. Every route here is a `GET`
    that you call with **your own LambdaTest credentials**; none of them changes an exploration.
    (One has a small side effect, stated in its description: `GET /exploration/labels`.)

    `info.version` is the API's version (`12.0`).

    ## Concepts

    | Term | What it is | Id shape |
    |---|---|---|
    | **Project** | A LambdaTest project. It holds **at most one live exploration**. | opaque string |
    | **Exploration** | The long-lived record of one site being explored: target URL, prompt, policy, and the **map** built so far. | UUIDv7, e.g. `0199f3a2-7c41-7d2e-9b1a-3f5c2e8d4a10` |
    | **Run** (also called a **session**) | One execution of the explorer against an exploration. Runs add to the same map. States: `queued` → `running` → `stopped`. | UUIDv7 |
    | **Junction** (a *screen*) | One distinct screen of the site, with its controls (*affordances*), versions and notes. | ULID (26 Crockford base32 chars, e.g. `01JAB3C4D5E6F7G8H9JKMNPQRS`) or 64 lowercase hex |
    | **Flow** | A verified path between screens: an entry junction, an exit junction, and the steps between. | ULID |
    | **Candidate** | A control on a screen that has not become a flow yet (the frontier). | 64 lowercase hex (content hash) |
    | **Observation** | One walk of a flow in one run: its outcome and its recorded steps. | 64 lowercase hex |
    | **Finding** | Something worth a person's attention (console error, broken link, slow page, accessibility issue, …), with one *occurrence* per run that saw it. | 64 lowercase hex |
    | **Alias** | A junction id folded into another one (`from` → `to`). | – |
    | **Feedback record** | A note, label, verdict, do-not-touch or resolve that a person or the agent attached to an item. | `fb-<uuidv7>` |
    | **Label** | A project's tag that can be applied to findings, flows or junctions. | `label-<uuidv7>` |

    ## Typical sequence for an agent

    1. `GET /exploration?state=all` — list explorations in your org; pick an `exploration_id`.
    2. `GET /exploration/{id}/view/summary` — counts, runs, labels, and a `change_cursor`.
    3. `GET /exploration/{id}/view/findings` (then `?cursor=<next>` until `next` is `null`) —
       every finding as a row. Do the same for `/view/flows` and `/view/junctions` if you need them.
    4. `GET /exploration/{id}/view/findings/{finding_id}` — one finding with all its occurrences.
    5. `GET /exploration/{id}/view/screenshot?finding=<id>&run=<run_id>` and
       `GET /exploration/{id}/view/evidence?finding=<id>&run=<run_id>&file=network` — each answers
       a **signed URL** (valid 10 minutes) that you fetch **without** an `Authorization` header.
    6. Optional: `GET /exploration/{id}/sessions` for the runs, `GET /exploration/{id}/skill` for the
       English "how this site works" skill the explorer keeps.

    ## Reading a map

    The `/view/*` routes split the map into paged rows and detail panels, and every string is passed
    through a secret fence: text that looks like a credential, token, JWT or email address is replaced
    by `REDACTED` or a placeholder such as `{email}` / `{key}`, and only allow-listed fields are
    served. Screenshot and evidence storage paths never appear; you ask the server to sign one instead.

    ## Pagination

    * `GET /exploration` and `GET /exploration/{id}/sessions`: `limit` (1–100, default 20) and an
      opaque `cursor`; the response's `next_cursor` is `null` on the last page.
    * `/view/{junctions|flows|findings|aliases}` and the detail lists
      (`/view/junctions/{item}/candidates`, `/view/flows/{item}/observations`): a fixed page of
      **500** rows; pass the response's `next` back as `cursor`. `next` is `null` on the last page.
      View cursors are signed and bound to one exploration and one list; a cursor from another list
      is `400 INVALID_REQUEST "bad cursor"`.
    * `/view/changes`: incremental reads from the summary's `change_cursor` (see that operation).

    ## Past runs (`as_of_run`)

    Every `/view/*` route and `skill` take `as_of_run=<run_id>`: the map as it was at
    the end of that run. A past run's map never changes and is served from a cache for 10 minutes.

    ## Limits and behaviour worth knowing

    * Unknown query parameters are refused with `400 INVALID_REQUEST` on the list, sessions,
      `assurance/head` and all `/view/*` routes.
    * Explorations are **org-scoped**: an exploration of another org is `404 NOT_FOUND`, never `403`.
    * An exploration recorded by an older explorer version is never served: `409 EXPLORATION_OUTDATED`.
    * While the service is being updated, every route answers
      `503 NOT_READY`.
    * Signed screenshot/evidence URLs live 600 seconds (`expires_in`).
    * The server-sent-event stream `/view/stream` ends after 30 minutes; reconnect.
    * `/view/changes` answers `reset: true` (re-read the map) when more than 5000 rows changed.
    * There is no rate limit; please poll politely. To follow a running exploration, open
      `/view/stream` and call `/view/changes` on each event instead of re-reading the pages.

    ## Errors

    Exploration errors share one envelope: `{"code": "<CODE>", "error": "<readable line>", ...}`,
    sometimes with `problems` (a list of strings) or other facts. The sign-in check that
    runs before these routes answers `401` with `{"error": "..."}` and no `code`.
servers:
  - url: https://kaneai-api.lambdatest.com/v16-controller/v1
    description: Production
security:
  - basicAuth: []
  - bearerAuth: []
tags:
  - name: Explorations
    description: List the explorations in your org.
  - name: Sessions
    description: The runs (sessions) of one exploration.
  - name: Map view
    description: |
      The paged, fenced view of an exploration's map: summary, rows of screens (junctions), flows,
      findings and aliases, and their detail panels. This is what the KaneAI explore viewer reads.
  - name: Findings & evidence
    description: Findings, their screenshots and evidence packs.
  - name: Context
    description: The exploration's skill and its assurance export cursor.
  - name: Feedback
    description: Feedback records people and the agent attached to items, and the project's labels.

paths:
  /exploration:
    get:
      tags: [Explorations]
      operationId: listExplorations
      summary: List explorations
      description: |
        The explorations of your org, newest first (by creation time). By default (`state=running`)
        only explorations that have a queued or running session are listed; use `state=all` to list
        every exploration that has not been deleted. Each row carries the current (queued/running)
        session, the latest session, and, when explore context is set up, a one-line context status.

        Start here to find an `exploration_id`.
      parameters:
        - name: state
          in: query
          description: "`running` (default): only explorations with a queued or running session. `all`: every live (not deleted) exploration."
          schema:
            type: string
            enum: [running, all]
            default: running
        - name: project
          in: query
          description: Only the exploration of this project id.
          schema:
            type: string
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/PageCursor"
      responses:
        "200":
          description: One page of explorations.
          content:
            application/json:
              schema:
                type: object
                required: [explorations, next_cursor]
                properties:
                  explorations:
                    type: array
                    items:
                      $ref: "#/components/schemas/ExplorationRow"
                  next_cursor:
                    type: [string, "null"]
                    description: Pass as `cursor` for the next page; `null` on the last page.
              example:
                explorations:
                  - exploration_id: 0199f3a2-7c41-7d2e-9b1a-3f5c2e8d4a10
                    project_id: 01JAB2M3N4P5Q6R7S8T9V0W1X2
                    name: Example storefront
                    target_url: https://example.com/
                    created_at: "2026-10-20T09:12:44.512Z"
                    created_by_user_id: 100001
                    running: false
                    current_session: null
                    last_session:
                      run_id: 0199f3b0-1a2b-7c3d-8e4f-5a6b7c8d9e0f
                      exploration_id: 0199f3a2-7c41-7d2e-9b1a-3f5c2e8d4a10
                      version: 3
                      state: stopped
                      remark: { code: completed, message: "explored to the end of the frontier" }
                      stop_reason: frontier_empty
                      mode: local
                      policy: read_only
                      started_by_user_id: 100001
                      started_at: "2026-10-21T08:00:03Z"
                      claimed_at: null
                      ended_at: "2026-10-21T08:41:57Z"
                      stop_requested_at: null
                      stopped_by_user_id: 100001
                      hx_job_id: null
                      hx_job_link: null
                      requested: null
                      leases: 42
                      findings: 7
                      credits: { total: 118.5, calls: 311, by_node: {}, by_phase: {} }
                    context: { enabled: true, last_job_status: ok, running: false }
                next_cursor: null
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "500": { $ref: "#/components/responses/InternalError" }
        "502": { $ref: "#/components/responses/BadGateway" }
        "503": { $ref: "#/components/responses/NotReady" }

  /exploration/{id}/sessions:
    get:
      tags: [Sessions]
      operationId: listSessions
      summary: List an exploration's sessions
      description: |
        The exploration's runs ("sessions"), newest first (by run version). Use it to find run ids
        for `as_of_run`, or to see how each run ended (`remark`), what it cost (`credits`), and how
        many leases and findings it produced.
      parameters:
        - $ref: "#/components/parameters/ExplorationId"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/PageCursor"
      responses:
        "200":
          description: One page of sessions.
          content:
            application/json:
              schema:
                type: object
                required: [exploration_id, sessions, next_cursor]
                properties:
                  exploration_id: { type: string }
                  sessions:
                    type: array
                    items: { $ref: "#/components/schemas/Session" }
                  next_cursor:
                    type: [string, "null"]
                    description: Pass as `cursor` for the next page; `null` on the last page.
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Outdated" }
        "500": { $ref: "#/components/responses/InternalError" }
        "502": { $ref: "#/components/responses/BadGateway" }
        "503": { $ref: "#/components/responses/NotReady" }

  /exploration/{id}/sessions/{run}:
    get:
      tags: [Sessions]
      operationId: getSession
      summary: Get one session
      description: One run of the exploration, the same shape as a row of `listSessions`.
      parameters:
        - $ref: "#/components/parameters/ExplorationId"
        - $ref: "#/components/parameters/RunPath"
      responses:
        "200":
          description: The session.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Session" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Outdated" }
        "500": { $ref: "#/components/responses/InternalError" }
        "502": { $ref: "#/components/responses/BadGateway" }
        "503": { $ref: "#/components/responses/NotReady" }

  /exploration/{id}/view/summary:
    get:
      tags: [Map view]
      operationId: getViewSummary
      summary: Map summary
      description: |
        The map at a glance: counts of junctions, flows, findings, aliases and observations; the
        exploration's runs; the project's labels; the owner's merge/split verdicts; and a
        `change_cursor` to start incremental reads with `/view/changes`. Read this first.
      parameters:
        - $ref: "#/components/parameters/ExplorationId"
        - $ref: "#/components/parameters/AsOfRun"
      responses:
        "200":
          description: The summary.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ViewSummary" }
              example:
                view_version: "1.0"
                exploration_id: 0199f3a2-7c41-7d2e-9b1a-3f5c2e8d4a10
                project_id: 01JAB2M3N4P5Q6R7S8T9V0W1X2
                as_of_run: null
                entry: 01JAB3C4D5E6F7G8H9JKMNPQRS
                runs:
                  - run_id: 0199f3b0-1a2b-7c3d-8e4f-5a6b7c8d9e0f
                    locale: en-US
                    complete: true
                    started_at: "2026-10-21T08:00:03Z"
                labels: []
                verdicts: []
                rejected_pairs: []
                last_seq: 57
                attempt: null
                counts: { junctions: 24, flows: 31, findings: 7, aliases: 2, observations: 66 }
                change_cursor: eyJlIjoiMDE5OWYzYTIiLCJrIjoiY2hhbmdlcyIsImMiOjU3fQ.c2lnbmF0dXJlLWV4YW1wbGU
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Outdated" }
        "500": { $ref: "#/components/responses/InternalError" }
        "501": { $ref: "#/components/responses/NotConfigured" }
        "502": { $ref: "#/components/responses/BadGateway" }
        "503": { $ref: "#/components/responses/NotReady" }

  /exploration/{id}/view/junctions:
    get:
      tags: [Map view]
      operationId: listViewJunctions
      summary: Page through screens (junctions)
      description: |
        Every junction (screen) as a row, ordered by id, 500 per page. A row is the fenced junction
        without its affordances, versions, instances and description (fetch
        `/view/junctions/{item}` for those), plus summaries: `control_groups`, `version_count`,
        `instance_count`, `cand` (candidates and frontier), `load_blocked` and `arrive` (credits spent
        reaching it). A junction folded into another (see aliases) has empty `cand` and `arrive`.
      parameters:
        - $ref: "#/components/parameters/ExplorationId"
        - $ref: "#/components/parameters/ViewCursor"
        - $ref: "#/components/parameters/AsOfRun"
      responses:
        "200":
          description: One page of junction rows.
          content:
            application/json:
              schema:
                type: object
                required: [rows, next]
                properties:
                  rows:
                    type: array
                    items: { $ref: "#/components/schemas/JunctionRow" }
                  next: { $ref: "#/components/schemas/NextCursor" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Outdated" }
        "500": { $ref: "#/components/responses/InternalError" }
        "501": { $ref: "#/components/responses/NotConfigured" }
        "502": { $ref: "#/components/responses/BadGateway" }
        "503": { $ref: "#/components/responses/NotReady" }

  /exploration/{id}/view/flows:
    get:
      tags: [Map view]
      operationId: listViewFlows
      summary: Page through flows
      description: |
        Every flow as a row, ordered by id, 500 per page. A row is the fenced flow without its `plan`
        and `description` (fetch `/view/flows/{item}`), plus `obs`: how many observations it has, the
        latest outcome, what blocked loading, and its cost.
      parameters:
        - $ref: "#/components/parameters/ExplorationId"
        - $ref: "#/components/parameters/ViewCursor"
        - $ref: "#/components/parameters/AsOfRun"
      responses:
        "200":
          description: One page of flow rows.
          content:
            application/json:
              schema:
                type: object
                required: [rows, next]
                properties:
                  rows:
                    type: array
                    items: { $ref: "#/components/schemas/FlowRow" }
                  next: { $ref: "#/components/schemas/NextCursor" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Outdated" }
        "500": { $ref: "#/components/responses/InternalError" }
        "501": { $ref: "#/components/responses/NotConfigured" }
        "502": { $ref: "#/components/responses/BadGateway" }
        "503": { $ref: "#/components/responses/NotReady" }

  /exploration/{id}/view/findings:
    get:
      tags: [Findings & evidence]
      operationId: listViewFindings
      summary: Page through findings
      description: |
        Every finding as a row, ordered by id, 500 per page. A row is the fenced finding without its
        `occurrences`, plus `occ`: the number of occurrences, the runs that saw it, and the latest
        run's screenshot facts (whether one exists, its size and overlay boxes). Fetch
        `/view/findings/{item}` for the occurrences and their evidence.
      parameters:
        - $ref: "#/components/parameters/ExplorationId"
        - $ref: "#/components/parameters/ViewCursor"
        - $ref: "#/components/parameters/AsOfRun"
      responses:
        "200":
          description: One page of finding rows.
          content:
            application/json:
              schema:
                type: object
                required: [rows, next]
                properties:
                  rows:
                    type: array
                    items: { $ref: "#/components/schemas/FindingRow" }
                  next: { $ref: "#/components/schemas/NextCursor" }
              example:
                rows:
                  - id: 366edfacccb51ea7d04d09be9ea851db9b0f902255828947c274ed6951ce998f
                    kind: broken_link
                    severity: medium
                    category: broken
                    title: "Footer link to /careers answers 404"
                    description: "The footer's Careers link leads to a page that answers 404."
                    status: open
                    confirmed: true
                    feedback: []
                    occ:
                      count: 2
                      runs: [0199f3b0-1a2b-7c3d-8e4f-5a6b7c8d9e0f]
                      latest_shot:
                        screenshot: true
                        screenshot_size: { w: 1280, h: 713 }
                        annotations:
                          - bbox: { x: 912, y: 640, w: 64, h: 18 }
                            label: Careers
                            kind: target
                        run_id: 0199f3b0-1a2b-7c3d-8e4f-5a6b7c8d9e0f
                next: null
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Outdated" }
        "500": { $ref: "#/components/responses/InternalError" }
        "501": { $ref: "#/components/responses/NotConfigured" }
        "502": { $ref: "#/components/responses/BadGateway" }
        "503": { $ref: "#/components/responses/NotReady" }

  /exploration/{id}/view/aliases:
    get:
      tags: [Map view]
      operationId: listViewAliases
      summary: Page through junction aliases
      description: |
        The map's junction aliases (`from` was folded into `to`), ordered by `from`, 500 per page.
        Use it to resolve a junction id you hold (say, from an occurrence) to the screen the map now
        draws it as.
      parameters:
        - $ref: "#/components/parameters/ExplorationId"
        - $ref: "#/components/parameters/ViewCursor"
        - $ref: "#/components/parameters/AsOfRun"
      responses:
        "200":
          description: One page of aliases.
          content:
            application/json:
              schema:
                type: object
                required: [rows, next]
                properties:
                  rows:
                    type: array
                    items: { $ref: "#/components/schemas/AliasRow" }
                  next: { $ref: "#/components/schemas/NextCursor" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Outdated" }
        "500": { $ref: "#/components/responses/InternalError" }
        "501": { $ref: "#/components/responses/NotConfigured" }
        "502": { $ref: "#/components/responses/BadGateway" }
        "503": { $ref: "#/components/responses/NotReady" }

  /exploration/{id}/view/changes:
    get:
      tags: [Map view]
      operationId: getViewChanges
      summary: Rows changed since a cursor
      description: |
        Incremental reads. Start with the summary's `change_cursor`; each answer lists the rows
        (junctions, flows, findings, aliases) stamped since that cursor, with their new row (`row:
        null` when the item left the map), the summary again, and `next`, the cursor for the next
        read. Nothing new: `changes` is empty, `summary` is `null` and `next` is the cursor you sent.
        `reset: true` means more than 5000 rows changed: re-read the map from the pages. With
        `as_of_run` the answer is always empty (a past run's map never changes). `more` is always
        `false`.

        Pair it with `/view/stream`, which tells you when to call this.
      parameters:
        - $ref: "#/components/parameters/ExplorationId"
        - name: cursor
          in: query
          required: true
          description: A change cursor (the summary's `change_cursor`, or a previous answer's `next`).
          schema: { type: string }
        - $ref: "#/components/parameters/AsOfRun"
      responses:
        "200":
          description: The changes.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ViewChanges" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Outdated" }
        "500": { $ref: "#/components/responses/InternalError" }
        "501": { $ref: "#/components/responses/NotConfigured" }
        "502": { $ref: "#/components/responses/BadGateway" }
        "503": { $ref: "#/components/responses/NotReady" }

  /exploration/{id}/view/stream:
    get:
      tags: [Map view]
      operationId: streamViewChanges
      summary: Server-sent events when the map moves
      description: |
        A `text/event-stream` that tells you when committed progress moved the map (or the project's
        labels changed). It sends:

        * `: open` once, then `: ping` comments every 15 seconds to keep the line open;
        * `event: change` with `data: {"change": <n>, "labels": <n>}` whenever either counter moved.

        On a `change` event, call `/view/changes` with your cursor. Your access is checked again before
        each event; the stream simply ends if it was revoked. Every stream ends after 30 minutes;
        open another. `as_of_run` is accepted but ignored.
      parameters:
        - $ref: "#/components/parameters/ExplorationId"
        - $ref: "#/components/parameters/AsOfRun"
      responses:
        "200":
          description: The event stream.
          content:
            text/event-stream:
              schema:
                type: string
                description: SSE frames as described above.
              example: |
                : open

                event: change
                data: {"change":58,"labels":3}

                : ping
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Outdated" }
        "500": { $ref: "#/components/responses/InternalError" }
        "501": { $ref: "#/components/responses/NotConfigured" }
        "502": { $ref: "#/components/responses/BadGateway" }
        "503": { $ref: "#/components/responses/NotReady" }

  /exploration/{id}/view/junctions/{item}:
    get:
      tags: [Map view]
      operationId: getViewJunction
      summary: One screen (junction) in full
      description: |
        The fenced junction with everything its row leaves out (affordances, versions, instances,
        description), and every match verdict on it, its versions, or a junction folded into it.
        `item` is the junction's id as the map stores it (not resolved through aliases).
      parameters:
        - $ref: "#/components/parameters/ExplorationId"
        - name: item
