        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Outdated" }
        "500": { $ref: "#/components/responses/InternalError" }
        "501": { $ref: "#/components/responses/NotConfigured" }
        "502": { $ref: "#/components/responses/BadGateway" }
        "503": { $ref: "#/components/responses/NotReady" }

  /exploration/{id}/view/junctions/{item}/candidates:
    get:
      tags: [Map view]
      operationId: listViewJunctionCandidates
      summary: Candidates drawn at a screen
      description: |
        The candidates (controls not yet walked into flows) drawn at this junction, including those
