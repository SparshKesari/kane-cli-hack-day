                    items: { $ref: "#/components/schemas/Candidate" }
                  next: { $ref: "#/components/schemas/NextCursor" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Outdated" }
        "500": { $ref: "#/components/responses/InternalError" }
        "501": { $ref: "#/components/responses/NotConfigured" }
        "502": { $ref: "#/components/responses/BadGateway" }
        "503": { $ref: "#/components/responses/NotReady" }

  /exploration/{id}/view/flows/{item}:
    get:
      tags: [Map view]
      operationId: getViewFlow
      summary: One flow in full
      description: |
        The fenced flow (with its plan and description) and its current observation: the one named by
        `current_observation`, else its newest; `null` when it has none. Each observation carries the
        recorded steps (`record.action_instruction` is what the step did, masked).
      parameters:
        - $ref: "#/components/parameters/ExplorationId"
        - name: item
          in: path
          required: true
          description: Flow id (ULID).
          schema: { type: string }
          example: 01JAB3D0F1W2X3Y4Z5A6B7C8D9
        - $ref: "#/components/parameters/AsOfRun"
      responses:
        "200":
          description: The flow.
          content:
            application/json:
              schema:
                type: object
                required: [flow, current]
                properties:
                  flow: { $ref: "#/components/schemas/Flow" }
                  current:
                    oneOf:
                      - $ref: "#/components/schemas/Observation"
                      - type: "null"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Outdated" }
        "500": { $ref: "#/components/responses/InternalError" }
        "501": { $ref: "#/components/responses/NotConfigured" }
        "502": { $ref: "#/components/responses/BadGateway" }
        "503": { $ref: "#/components/responses/NotReady" }

  /exploration/{id}/view/flows/{item}/observations:
    get:
      tags: [Map view]
      operationId: listViewFlowObservations
      summary: A flow's observations
      description: Every observation (walk) of the flow, newest first, 500 per page.
      parameters:
        - $ref: "#/components/parameters/ExplorationId"
        - name: item
          in: path
          required: true
          description: Flow id.
          schema: { type: string }
        - $ref: "#/components/parameters/ViewCursor"
        - $ref: "#/components/parameters/AsOfRun"
      responses:
        "200":
          description: One page of observations.
          content:
            application/json:
              schema:
                type: object
                required: [rows, next]
