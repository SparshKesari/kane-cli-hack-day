openapi: 3.1.0
info:
  title: 'Kane AI shared projects API (read-only)'
  version: '2026-10-24'
  description: 'Every route checks your access to the project with Test Manager (kept 5 minutes), and fields may be null where
    the item has no value yet. Read-only routes for building your own tools and reports on your team''s shared projects: coverage,
    use cases, scenarios and their Test Manager cases, runs, sources and the traceability graph. Call them from your own server
    or script with your LambdaTest username and access key. Never put the key in a browser page. Be kind to the service: cache,
    and poll no faster than each route''s x-poll.'
servers:
- url: https://kaneai-api.lambdatest.com/v16-lattice
  description: Production
security:
- basicAuth: []
- bearerAuth: []
tags:
- name: Project
- name: Use cases
- name: Scenarios and runs
- name: Sources
- name: Graph
paths:
  /v1/projects:
    get:
      operationId: listProjects
      summary: Your projects
      description: 'The Test Manager projects your account can open, one page of 50, each with `marked`: true for a shared
        project. `name` searches every page and adds `total`. Each listed project''s mark is checked with Test Manager, so
        call it once when your app starts and cache it.'
      tags:
      - Project
      parameters:
      - name: page
        in: query
        description: 1 to 100 (default 1)
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 1
      - name: name
        in: query
        description: search project names (1 to 200 characters)
        schema:
          type: string
          minLength: 1
          maxLength: 200
      x-cost: medium (one Test Manager read per listed project)
      x-poll: once at start; cache 1 hour
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectList'
              example:
                items:
                - projectId: 01JEXAMPLE0000000000000001
                  name: Checkout web app
                  marked: true
                - projectId: 01JEXAMPLE0000000000000002
                  name: Mobile sign-in
                  marked: true
                next: null
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '503':
          $ref: '#/components/responses/Unavailable'
  /v1/projects/{projectId}/assurance:
    get:
      operationId: getAssurance
      summary: Project headline counts
      description: Use cases, criteria, scenarios, tests, open questions, sources, sessions and the last session. Takes no
        query parameters (extras are ignored).
      tags:
      - Project
      parameters:
      - name: projectId
        in: path
        required: true
        description: Your Test Manager project's id (see 'Finding your project id').
        schema:
          type: string
      x-cost: cheap
      x-poll: every 60 s at most
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Assurance'
              example:
                project: 01JEXAMPLE0000000000000000
                updatedAt: '2026-10-23T20:47:26.975Z'
                useCases:
                  total: 2
                  proposed: 0
                  approved: 2
                  archived: 0
                  stale: 0
                criteria:
                  total: 2
                  proposed: 0
                  approved: 2
                  archived: 0
                scenarios: 3
                tests: 3
                openQuestions: 0
                sources: 4
                sessions:
                  total: 3
                  waitingOnYou: 0
                  running: 0
                lastSession:
                  id: design-20261024T090000-a1b2c3
                  kind: Design
                  state: done
                  startedAt: '2026-10-23T20:43:58.996Z'
                capabilities:
                - use-case-query
                - source-query
                - session-name
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Importing'
        '503':
          $ref: '#/components/responses/Unavailable'
  /v1/projects/{projectId}/coverage:
    get:
      operationId: getCoverage
      summary: Project coverage
      description: 'The coverage document: the project''s percent, each use case''s state, and each criterion''s deciding
        run. It is computed one project at a time and kept. A read waits up to 10 s for it, then may answer `state: computing`
        with `doc: null`: ask again after a few seconds, with backoff. Kept about 5 minutes, and recomputed when the project
        or its counted runs change; a recompute reads counted runs from Test Manager and its time varies (about 3 s on a small
        project). Takes no query parameters (extras are ignored).'
      tags:
      - Project
      parameters:
      - name: projectId
        in: path
        required: true
        description: Your Test Manager project's id (see 'Finding your project id').
        schema:
          type: string
      x-cost: cheap when kept; a recompute reads Test Manager
      x-poll: every 5 minutes at most
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Coverage'
              example:
                state: ready
                doc:
                  coverage_version: 2
                  scope: project
                  config:
                    rule: newest_counted_verdict
                    weighting: risk
                    weights:
                      high: 1.25
                      med: 1
                      low: 0.75
                      unknown: 1
                  pct: 100
                  usecases:
                    total: 2
                    proven: 2
                    partial: 0
                    failing: 0
                    not_run: 0
                    not_designed: 0
                    no_criteria: 0
                  criteria:
                    total: 2
                    proven: 2
                  perUc:
                  - id: uc-1
                    title: Display a typed message
                    risk: med
                    weight: 1
                    state: proven
                    pct: 100
                    criteria: 1
                    proven: 1
                    manual_runs: 0
                    stale: false
                  - id: uc-2
                    title: Calculate the sum of two numbers
                    risk: med
                    weight: 1
                    state: proven
                    pct: 100
                    criteria: 1
                    proven: 1
                    manual_runs: 0
                    stale: false
                  perAc:
                    ac-1:
                      state: proven
                      uc: uc-1
                      deciding_run: tm:1000001
                    ac-2:
                      state: proven
                      uc: uc-2
                      deciding_run: tm:1000001
                  flags:
                    stale_sources: 0
                    sources_not_fully_extracted: []
                    orphaned_usecases: 0
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Importing'
        '503':
          $ref: '#/components/responses/Unavailable'
  /v1/projects/{projectId}/use-cases:
    get:
      operationId: listUseCases
      summary: Use cases, paged
      description: One row per use case with its coverage. Filters narrow the list; `total` counts every matching row.
      tags:
      - Use cases
      parameters:
      - name: projectId
        in: path
        required: true
        description: Your Test Manager project's id (see 'Finding your project id').
        schema:
          type: string
      - name: status
        in: query
        description: proposed, approved or archived
        schema:
          type: string
          enum:
          - proposed
          - approved
          - archived
      - name: q
        in: query
        description: search the title and summary (1 to 100 characters, after trimming spaces)
        schema:
          type: string
          minLength: 1
          maxLength: 100
      - name: sort
        in: query
        description: position (default), title or risk
        schema:
          type: string
          enum:
          - position
          - title
          - risk
      - name: order
        in: query
        description: asc or desc
        schema:
          type: string
          enum:
          - asc
          - desc
      - name: stale
        in: query
        description: true or false
        schema:
          type: string
          enum:
          - 'true'
          - 'false'
      - name: designed
        in: query
        description: true or false
        schema:
          type: string
          enum:
          - 'true'
          - 'false'
      - name: risk
        in: query
        description: high, medium or low
        schema:
          type: string
          enum:
          - high
          - medium
          - low
      - name: facets
        in: query
        description: true adds counts by status, risk and staleness
        schema:
          type: string
          enum:
          - 'true'
      - name: limit
        in: query
        description: Page size, 1 to 200 (default 50). Keep it at 50 or below.
        schema:
          type: integer
          minimum: 1
          maximum: 200
          default: 50
      - name: next
        in: query
        description: The previous page's `next`, passed back exactly as given (an opaque cursor).
        schema:
          type: string
          minLength: 1
      x-cost: medium (its coverage reads counted runs from Test Manager)
      x-poll: every 5 minutes at most; limit 50 or less
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UseCaseList'
              example:
                total: 2
                items:
                - id: uc-1
                  title: Display a typed message
                  summary: See an entered message displayed.
                  risk: medium
                  status: approved
                  stale: false
                  staleReason: null
                  designed: true
                  changedSinceDesign: false
                  scenarios: 2
                  criteria: 1
                  updatedBy: A teammate
                  updatedAt: '2026-10-23T20:36:11.158Z'
                  coverage:
                    pct: 100
                    status: proven
                    manualRuns: 0
                  coverageV2:
                    pct: 100
                    status: proven
                    manualRuns: 0
                - id: uc-2
                  title: Calculate the sum of two numbers
                  summary: See the sum of two entered numbers.
                  risk: medium
                  status: approved
                  stale: false
                  staleReason: null
                  designed: true
                  changedSinceDesign: false
                  scenarios: 1
                  criteria: 1
                  updatedBy: A teammate
                  updatedAt: '2026-10-23T20:36:11.158Z'
                  coverage:
                    pct: 100
                    status: proven
                    manualRuns: 0
                  coverageV2:
                    pct: 100
                    status: proven
                    manualRuns: 0
                next: null
                coverage:
                  state: ready
                  aspect: one-rule
                  pct: 100
                  acsProven: 2/2
                coverageV2:
                  state: ready
                  pct: 100
                  acsProven: 2/2
                  note: null
                  useCases:
                    total: 2
                    proven: 2
                    partial: 0
                    failing: 0
                    notRun: 0
                    notDesigned: 0
                    noCriteria: 0
                  flags:
                    staleSources: 0
                    sourcesNotFullyExtracted: []
                    orphanedUseCases: 0
                  weighting: risk
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Importing'
        '503':
          $ref: '#/components/responses/Unavailable'
