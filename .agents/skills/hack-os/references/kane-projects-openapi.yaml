                  usedIn: 2
                - id: su-conv-design-20261024T090000-a1b2c3
                  format: conversation
                  fingerprint: sha256:000000000000…
                  versions: 3
                  updatedAt: '2026-10-23T20:39:50.372Z'
                  extraction: not extracted
                  usedIn: 0
                next: null
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Importing'
        '503':
          $ref: '#/components/responses/Unavailable'
  /v1/projects/{projectId}/sources/{sourceId}:
    get:
      operationId: getSource
      summary: One source
      description: Its versions and the use cases that cite it.
      tags:
      - Sources
      parameters:
      - name: projectId
        in: path
        required: true
        description: Your Test Manager project's id (see 'Finding your project id').
