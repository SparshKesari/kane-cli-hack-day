            additionalProperties: true
      additionalProperties: true
    Scenario:
      type: object
      properties:
        id:
          type: string
        title:
          type:
          - string
          - 'null'
        description:
          type:
          - string
          - 'null'
        intent:
          type:
          - string
          - 'null'
        type:
          type:
          - string
          - 'null'
        status:
          type:
          - string
          - 'null'
          description: proposed (the agent's, not yet reviewed), approved or archived
          enum:
          - proposed
          - approved
          - archived
          - null
        stale:
          type:
          - boolean
          - 'null'
          description: true when what it was made from has changed since
        staleReason:
          anyOf:
          - type: string
            description: why it is stale, in words
          - type: 'null'
        state:
          type:
          - string
          - 'null'
        tags:
          type:
          - array
          - 'null'
          items:
            type: string
        parameters:
          description: the scenario's data parameters as designed (any shape), or null
        techniqueNotes:
          anyOf:
          - type: string
          - type: 'null'
        useCase:
          type:
          - object
          - 'null'
          properties:
            id:
              type: string
            title:
              type:
              - string
              - 'null'
          additionalProperties: true
        test:
          anyOf:
          - type: object
            properties:
              id:
                type: string
                description: e.g. t-1
              title:
                type:
                - string
                - 'null'
              steps:
                type:
                - array
                - 'null'
                items:
                  type: object
                  properties:
                    n:
                      type:
                      - integer
                      - 'null'
                    text:
                      type:
                      - string
                      - 'null'
                    verifies:
                      type:
                      - array
                      - 'null'
                      items:
                        type: string
                  additionalProperties: true
            additionalProperties: true
          - type: 'null'
        testCase:
          anyOf:
          - $ref: '#/components/schemas/TestCaseLink'
          - type: 'null'
        lastRun:
          anyOf:
          - $ref: '#/components/schemas/Run'
          - type: 'null'
        runs:
          $ref: '#/components/schemas/RunPage'
        criteria:
          type:
          - array
          - 'null'
          items:
            type: object
            properties: {}
            additionalProperties: true
        versions:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/Version'
        replacedBy:
          anyOf:
          - type: string
            description: the content id of the scenario that replaced this one
          - type: 'null'
      additionalProperties: true
    RunPage:
      type: object
      description: A page of runs. For a scenario with a Test Manager case the first page holds up to 10 runs and later pages
        up to 50, whatever limit asks, and runs with no outcome are left out, so a page can be shorter.
      properties:
        total:
          type: integer
          description: 'for a scenario with a Test Manager case: the runs shown so far, growing page by page'
        items:
          type: array
          items:
            $ref: '#/components/schemas/Run'
        next:
          anyOf:
          - type: string
          - type: 'null'
        unavailable:
          type:
          - boolean
          - 'null'
          description: Test Manager didn't answer in time; ask again later
      additionalProperties: true
    SourceRow:
      type: object
      properties:
        id:
          type: string
          description: the source's name, e.g. prd
        format:
          type:
          - string
          - 'null'
        fingerprint:
          type:
          - string
          - 'null'
          description: its current version's content hash
        versions:
          type:
          - integer
          - 'null'
        updatedAt:
          type:
          - string
          - 'null'
        extraction:
          type:
          - string
          - 'null'
          description: complete, partial, …
        usedIn:
          type:
          - integer
          - 'null'
          description: use cases citing it
      additionalProperties: true
    SourceList:
      type: object
      properties:
        total:
          type: integer
        items:
          type: array
          items:
            $ref: '#/components/schemas/SourceRow'
        next:
          anyOf:
          - type: string
          - type: 'null'
      additionalProperties: true
    Source:
      type: object
      properties:
        id:
          type: string
        format:
          type:
          - string
          - 'null'
        fingerprint:
          type:
          - string
          - 'null'
        extraction:
          type:
          - string
          - 'null'
        updatedAt:
          type:
          - string
          - 'null'
        versions:
          type:
          - array
          - 'null'
          items:
            type: object
            properties: {}
            additionalProperties: true
        citedBy:
          type:
          - object
          - 'null'
          properties:
            useCases:
              type:
              - integer
              - 'null'
            items:
              type: array
              items:
                type: object
                properties:
                  id:
                    type: string
                  title:
                    type:
                    - string
                    - 'null'
                  citations:
                    type:
                    - integer
                    - 'null'
                additionalProperties: true
          additionalProperties: true
      additionalProperties: true
    Graph:
      type: object
      description: Nodes and edges in the shape React Flow takes.
      properties:
        scope:
          type:
          - object
          - 'null'
          description: 'What was asked: {project: true}, {useCase: …}, {source: …} or {around: …, depth: …} (depth defaults
            to 1).'
          properties: {}
          additionalProperties: true
        nodes:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
              type:
                type:
                - string
                - 'null'
                description: source, useCase or testCase (trace view); or source, useCase, criterion, scenario, test, question,
                  evidence
              data:
                type:
                - object
                - 'null'
                properties:
                  label:
                    type:
                    - string
                    - 'null'
                  status:
                    type:
                    - string
                    - 'null'
                  stale:
                    type:
                    - boolean
                    - 'null'
                  risk:
                    type:
                    - string
                    - 'null'
                  coverageV2:
                    type:
                    - object
                    - 'null'
                    properties: {}
                    additionalProperties: true
                  caseId:
                    type:
                    - string
                    - 'null'
                  internalId:
                    type:
                    - string
                    - 'null'
                  linkState:
                    type:
                    - string
                    - 'null'
                  more:
                    type:
                    - boolean
                    - 'null'
                    description: 'lineage views: this node has more connections than were kept'
                additionalProperties: true
            additionalProperties: true
        edges:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
              source:
                type:
                - string
                - 'null'
              target:
                type:
                - string
                - 'null'
              type:
                type:
                - string
                - 'null'
            additionalProperties: true
        truncated:
          type:
          - boolean
          - 'null'
          description: 'true when the graph was cut at the limit: show ''more'', don''t treat it as the whole project'
        omitted:
          type:
          - object
          - 'null'
          description: 'Trace view only: how many were left out when truncated.'
          properties:
            useCases:
              type:
              - integer
              - 'null'
            sources:
              type:
              - integer
              - 'null'
            testCases:
              type:
              - integer
              - 'null'
          additionalProperties: true
      additionalProperties: true
  responses:
    BadRequest:
      description: 'A query that doesn''t match: an unknown parameter, a bad value, or a limit outside the route''s range
        (lists 1 to 200, the graph 1 to 1000).'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: BAD_REQUEST
              message: 'the query does not match: limit: Too big: expected number to be <=200'
    Unauthenticated:
      description: No credential, a wrong one, or a passing failure of the sign-in check. Try once more after 30 s; if it
        stays, check the username and access key.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: UNAUTHENTICATED
              message: Missing or invalid Authorization header
    Forbidden:
      description: 'PROJECT_NOT_MARKED: the project''s shared-project mark was removed.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: PROJECT_NOT_MARKED
              message: …
    NotFound:
      description: 'NOT_FOUND: no such item, or a project you can''t open (answered as if it didn''t exist; your right to
        a project is kept for 5 minutes, so access granted just now can still answer this). NO_CONTEXT: the project has no
        shared work yet.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: NOT_FOUND
              message: no use case uc-404 in this project
    Importing:
      description: 'CONTEXT_IMPORTING: an import is writing the project; ask again later.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: CONTEXT_IMPORTING
              message: …
    Unavailable:
      description: 'A service behind it isn''t answering (FORGE_UNAVAILABLE: Test Manager; NOT_READY or HISTORY_BUILDING:
        not ready yet). Back off and ask again later.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: FORGE_UNAVAILABLE
              message: …
