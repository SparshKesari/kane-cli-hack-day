          minimum: 1
          maximum: 200
          default: 50
      - name: next
        in: query
        description: The previous page's `next`, passed back exactly as given (an opaque cursor).
        schema:
          type: string
          minLength: 1
      x-cost: cheap
      x-poll: every 10 minutes at most
      responses:
