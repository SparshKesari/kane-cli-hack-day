        required: true
        description: Your Test Manager project's id (see 'Finding your project id').
        schema:
          type: string
      - name: q
        in: query
        description: search names (1 to 100 characters, after trimming spaces)
        schema:
          type: string
          minLength: 1
          maxLength: 100
      - name: limit
