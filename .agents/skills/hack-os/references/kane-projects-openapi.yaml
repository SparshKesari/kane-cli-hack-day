  /v1/projects/{projectId}/graph:
    get:
      operationId: getGraph
      summary: The traceability graph
      description: 'Exactly one scope. The trace view (sources, use cases and test cases) is `project=1`, or `useCase=<id>`
        with `types` naming `testCase` (or `relations` naming `holds`); it takes only types `source,useCase,testCase` and
        relations `derives,holds`, and only those two scopes. The lineage view is `useCase=<id>` alone, `source=<name>`, or
        `around=<id>` with `depth` 1 to 3, with the lineage types and relations. Mixing the two views'' values is refused
        (400). Capped at `limit` nodes: when `truncated` is true, show that more exist (the trace view also gives `omitted`
        counts; lineage views mark nodes with `data.more`). The heaviest read here: open it when a person asks, cache it 15
        minutes, never poll it.'
      tags:
      - Graph
      parameters:
      - name: projectId
        in: path
        required: true
        description: Your Test Manager project's id (see 'Finding your project id').
        schema:
          type: string
      - name: project
        in: query
        description: 1 for the whole project's trace view
        schema:
          type: string
          enum:
          - '1'
      - name: useCase
        in: query
        description: a use case id, e.g. uc-1
        schema:
          type: string
          minLength: 1
      - name: source
        in: query
        description: a source's name
        schema:
          type: string
          minLength: 1
      - name: around
        in: query
        description: an item's id, with depth
        schema:
          type: string
          minLength: 1
      - name: depth
        in: query
        description: 1 to 3, with around
        schema:
          type: integer
          minimum: 1
          maximum: 3
      - name: types
        in: query
        description: 'comma-separated: source, useCase, testCase (trace view), or source, useCase, criterion, scenario, test,
          question, evidence'
        schema:
          type: string
      - name: relations
        in: query
        description: 'comma-separated: derives, holds (trace view), or derives, belongsTo, scopedTo, exercises, verifies,
          automates, dependsOn, reuses, asks, ran'
        schema:
          type: string
      - name: limit
        in: query
        description: most nodes, 1 to 1000; default 1000 in the trace view, 200 otherwise
        schema:
          type: integer
          minimum: 1
          maximum: 1000
      x-cost: heavy (calls Test Manager for cases and coverage)
      x-poll: never poll; on demand, cache 15 minutes
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Graph'
              example:
                scope:
                  project: true
                nodes:
                - id: uc-1
                  type: useCase
                  data:
                    label: Display a typed message
                    status: approved
                    stale: false
                    staleReason: null
                    risk: medium
                    coverageV2:
                      state: ready
                      pct: 100
                      status: proven
                      manualRuns: 0
                - id: prd
                  type: source
                  data:
                    label: prd.md
                    kind: file
                - id: uc-2
                  type: useCase
                  data:
                    label: Calculate the sum of two numbers
                    status: approved
                    stale: false
                    staleReason: null
                    risk: medium
                    coverageV2:
                      state: ready
                      pct: 100
                      status: proven
                      manualRuns: 0
                - id: sc-1
                  type: testCase
                  data:
                    label: Replace a previous displayed message
                    status: proposed
                    stale: false
                    staleReason: null
                    kind: negative
                    internalId: TC-4508
                    caseId: 01JEXAMPLE0000000000000000
                    tm: linked
                    linkState: linked
                    reason: null
                edges:
                - id: prd-derives-uc-1
                  source: prd
                  target: uc-1
                  type: derives
                  label: derives
                  data:
                    citations: 2
                - id: prd-derives-uc-2
                  source: prd
                  target: uc-2
                  type: derives
                  label: derives
                  data:
                    citations: 2
                - id: uc-1-holds-sc-1
                  source: uc-1
                  target: sc-1
                  type: holds
                  label: holds
                truncated: false
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Importing'
        '503':
          $ref: '#/components/responses/Unavailable'
